[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-a11y"
version = "0.3.0"
description = "A terminal accessibility enhancement layer providing screen-reader, photophobia, sensory-budget, braille, and audio-progress modes."
authors = [
    { name = "Terminal A11y Contributors", email = "hello@example.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "accessibility",
    "a11y",
    "ansi",
    "braille",
    "cli",
    "color",
    "console",
    "no-color",
    "nvda",
    "orca",
    "photophobia",
    "screen-reader",
    "terminal",
    "voiceover"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Topic :: Utilities",
    "Topic :: Accessibility"
]

[project.urls]
Homepage = "https://github.com/example/terminal-a11y"
Repository = "https://github.com/example/terminal-a11y"
Issues = "https://github.com/example/terminal-a11y/issues"

[project.scripts]
terminal-a11y = "terminal_a11y.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["terminal_a11y*"]
exclude = ["tests*"]
